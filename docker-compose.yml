version: '3.8'

services:
  simpledash:
    build: .
    container_name: simpledash
    hostname: simpledash.local
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - VIRTUAL_HOST=simpledash.local
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=simpledash.local
      - LETSENCRYPT_EMAIL=your-email@example.com
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./api.php:/usr/share/nginx/html/api.php:ro
      - simpledash-data:/data
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  simpledash-data:
