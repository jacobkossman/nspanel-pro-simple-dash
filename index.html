<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NSPanel Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300,0,0" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="error-toast" id="errorToast"></div>
        <div class="header">
            <div class="header-top">
                <div class="header-left">
                    <div class="room-name" id="roomName" onclick="openAdmin()">Loading...</div>
                    <div class="header-temp" id="headerTemp" style="display: none;" onclick="openHeaderClimateModal()">
                        <span class="header-temp-value" id="headerTempValue">—</span>
                    </div>
                </div>
                <div class="header-right">
                    <button class="phone-btn" id="phoneBtn" onclick="openVoiceMessageModal()" title="Voice Messages">
                        <span class="material-symbols-outlined">phone</span>
                        <span class="phone-badge" id="phoneBadge" style="display: none;">0</span>
                    </button>
                    <div class="status-indicator" id="statusIndicator"></div>
                </div>
            </div>
        </div>
        <div class="pages-container">
            <div class="pages-wrapper" id="pagesWrapper">
                <!-- Pages will be generated here -->
            </div>
            <div class="loading-overlay" id="loadingOverlay">Loading...</div>
        </div>
        <div class="page-dots" id="pageDots"></div>
        <button class="debug-edit-btn" id="debugEditBtn" onclick="openAdmin()" title="Open Admin" style="display:none;">
            <span class="material-symbols-outlined">edit</span>
        </button>
        <button class="debug-edit-btn" id="debugSettingsBtn" onclick="openAdmin(); showGlobalSettings();" title="Global Settings" style="display:none; bottom: 64px;">
            <span class="material-symbols-outlined">settings</span>
        </button>
    </div>

    <!-- Screensaver -->
    <div class="screensaver" id="screensaver">
        <div class="screensaver-room-temp" id="screensaverTemp"></div>
        <div class="screensaver-time" id="screensaverTime">00:00</div>
        <div class="screensaver-date" id="screensaverDate">Monday, January 1</div>
        <div class="screensaver-room" id="screensaverRoom">Living Room</div>
        <div class="screensaver-weather" id="screensaverWeather">
            <div class="screensaver-weather-icon" id="screensaverWeatherIcon"></div>
            <div class="screensaver-weather-info">
                <div class="screensaver-weather-temp" id="screensaverWeatherTemp"></div>
                <div class="screensaver-weather-condition" id="screensaverWeatherCondition"></div>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <!-- Content dynamically generated by JavaScript -->
    </div>

    <!-- Climate Control Modal -->
    <div class="climate-modal" id="climateModal" onclick="closeClimateModal(event)">
        <div class="climate-modal-content" onclick="event.stopPropagation()">
            <div class="climate-modal-header">
                <div class="climate-modal-title" id="climateModalTitle">Climate Control</div>
                <button class="climate-modal-close" onclick="closeClimateModal()">close</button>
            </div>
            <div class="climate-modal-body">
                <div class="climate-current-temp">
                    <div class="climate-label">Current</div>
                    <div class="climate-temp-large" id="climateCurrentTemp">22°C</div>
                </div>
                <div class="climate-target-temp">
                    <div class="climate-label">Target Temperature</div>
                    <div class="climate-temp-control">
                        <button class="climate-temp-btn" onclick="adjustModalTemperature(-1)">remove</button>
                        <div class="climate-temp-display" id="climateTargetTemp">22°C</div>
                        <button class="climate-temp-btn" onclick="adjustModalTemperature(1)">add</button>
                    </div>
                </div>
                <div class="climate-mode-selector" id="climateModeSelector">
                    <!-- Mode buttons will be generated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Weather Forecast Modal -->
    <div class="climate-modal" id="weatherModal" onclick="closeWeatherModal(event)">
        <div class="climate-modal-content" onclick="event.stopPropagation()">
            <div class="climate-modal-header">
                <div class="climate-modal-title" id="weatherModalTitle">Weather Forecast</div>
                <button class="climate-modal-close" onclick="closeWeatherModal()">close</button>
            </div>
            <div class="climate-modal-body">
                <div class="weather-current" id="weatherCurrent">
                    <!-- Current weather will be generated here -->
                </div>
                <div class="weather-forecast-list" id="weatherForecastList">
                    <!-- Forecast items will be generated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Icon Picker Modal -->
    <div class="climate-modal" id="iconPickerModal" onclick="closeIconPicker(event)">
        <div class="climate-modal-content" onclick="event.stopPropagation()">
            <div class="climate-modal-header">
                <div class="climate-modal-title">Choose Icon</div>
                <button class="climate-modal-close" onclick="closeIconPicker()">close</button>
            </div>
            <div class="climate-modal-body">
                <input type="text" class="form-input" id="iconSearchInput" placeholder="Search icons..." style="margin-bottom: 12px;">
                <div class="icon-grid" id="iconGrid">
                    <!-- Icons will be generated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Voice Message Modal -->
    <div class="climate-modal" id="voiceMessageModal" onclick="closeVoiceMessageModal(event)">
        <div class="climate-modal-content" onclick="event.stopPropagation()">
            <div class="climate-modal-header">
                <div class="climate-modal-title">Voice Messages</div>
                <button class="climate-modal-close" onclick="closeVoiceMessageModal()">close</button>
            </div>
            <div class="climate-modal-body">
                <div id="voiceMessageContent">
                    <!-- Content will be generated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Entity Editor Modal -->
    <div class="climate-modal" id="entityEditorModal" onclick="closeEntityModal(event)">
        <div class="climate-modal-content" onclick="event.stopPropagation()">
            <div class="climate-modal-header">
                <div class="climate-modal-title" id="entityEditorTitle">Add Entity</div>
                <button class="climate-modal-close" onclick="closeEntityModal()">close</button>
            </div>
            <div class="climate-modal-body">
                <div style="display: flex; flex-direction: column; gap: 14px;">
                    <div style="display: flex; gap: 12px;">
                        <div style="display: flex; flex-direction: column; gap: 4px; flex: 1;">
                            <label class="form-label" for="newEntityDomain">Domain</label>
                            <select class="form-input" id="newEntityDomain" onchange="updateEntityFormForDomain()">
                                <option value="light">light</option>
                                <option value="switch">switch</option>
                                <option value="scene">scene</option>
                                <option value="script">script</option>
                                <option value="climate">climate</option>
                                <option value="sensor">sensor</option>
                                <option value="media_player">media_player</option>
                                <option value="cover">cover</option>
                                <option value="lock">lock</option>
                                <option value="fan">fan</option>
                                <option value="group">group</option>
                                <option value="input_boolean">input_boolean</option>
                                <option value="automation">automation</option>
                                <option value="weather">weather</option>
                            </select>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px; flex: 2;">
                            <label class="form-label" for="newEntityId">Entity ID</label>
                            <input type="text" class="form-input" id="newEntityId" placeholder="living_room">
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label class="form-label" for="newEntityLabel">Label</label>
                        <input type="text" class="form-input" id="newEntityLabel" placeholder="Living Room">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label class="form-label">Icon</label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <button onclick="openIconPicker()" id="iconPickerButton" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-family: 'Material Symbols Outlined'; font-size: 22px; display: flex; align-items: center; gap: 8px; flex: 1;">
                                <span id="selectedIconPreview">search</span>
                                <span id="selectedIconName" style="font-family: 'Inter', sans-serif; font-size: 12px; color: rgba(255,255,255,0.5);">Choose icon</span>
                            </button>
                            <input type="hidden" id="newEntityIcon" value="">
                        </div>
                    </div>
                    <div id="entityOptHideState">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="newEntityHideState" aria-label="Hide state text on tile" style="width: 18px; height: 18px; cursor: pointer;">
                            <span style="font-size: 13px; color: #888;">Hide state text on tile</span>
                        </label>
                    </div>
                    <div id="entityOptLight" style="display: none;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="newEntityDisableDimming" aria-label="Disable dimming" style="width: 18px; height: 18px; cursor: pointer;">
                            <span style="font-size: 13px; color: #888;">Disable dimming (toggle only)</span>
                        </label>
                    </div>
                    <div id="entityOptSensor" style="display: none; flex-direction: column; gap: 4px;">
                        <label class="form-label" for="newEntityDecimals">Decimal places</label>
                        <select id="newEntityDecimals" class="form-input" style="width: 100px; padding: 6px 8px;">
                            <option value="">Default (0)</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>
                    <div id="entityOptWeather" style="display: none; flex-direction: column; gap: 8px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="newEntityHideWeatherName" aria-label="Hide weather entity name" style="width: 18px; height: 18px; cursor: pointer;">
                            <span style="font-size: 13px; color: #888;">Hide name</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="newEntityHideWeatherIcon" aria-label="Hide weather icon" style="width: 18px; height: 18px; cursor: pointer;">
                            <span style="font-size: 13px; color: #888;">Hide icon</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="newEntityHideWeatherForecast" aria-label="Hide weather forecast" style="width: 18px; height: 18px; cursor: pointer;">
                            <span style="font-size: 13px; color: #888;">Disable forecast popup</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="newEntityWeatherFullRow" aria-label="Full row layout" style="width: 18px; height: 18px; cursor: pointer;">
                            <span style="font-size: 13px; color: #888;">Full row (icon left, content right)</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="newEntityShowInlineForecast" aria-label="Show forecast on tile" style="width: 18px; height: 18px; cursor: pointer;">
                            <span style="font-size: 13px; color: #888;">Show forecast on tile</span>
                        </label>
                    </div>
                    <button class="save-btn" onclick="saveEntityModal()">Save Entity</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
